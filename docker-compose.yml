services:
  tyket-app:
    image: node:22-alpine
    container_name: tyket-app
    restart: unless-stopped
    network_mode: "host"
    environment:
      - PORT=3001
    volumes:
      - ./output:/app/.output
    working_dir: /app
    command: ["node", ".output/server/index.mjs"]
    env_file:
      - .env